input_guard:
  enabled: true
  block_on_high_severity: true
  custom_patterns: []

output_guard:
  enabled: true
  sanitize_secrets: true
  max_output_length: 50000

tool_guard:
  mode: "default"

behavior_guard:
  max_steps: 20
  token_budget: 50000
  deviation_threshold: 0.6
  consecutive_deviation_limit: 5