tools:
  web_search:
    enabled: true
    timeout_seconds: 30
  file_read:
    enabled: true
    timeout_seconds: 10
    allowed_dirs:
      - "./workspace"
  file_write:
    enabled: true
    timeout_seconds: 10
    allowed_dirs:
      - "./workspace"
  code_runner:
    enabled: true
    timeout_seconds: 35
    sandbox_dir: "./tmp"