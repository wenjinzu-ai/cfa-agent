app:
  host: "127.0.0.1"
  port: 8000
  debug: true

llm:
  model: "gpt-4o-mini"
  reasoning_model: "gpt-4o"
  max_tokens_per_request: 4096
  temperature: 0.7

database:
  sqlite_db_path: "./data/cfa_agent.db"

log:
  level: "DEBUG"
  file: "./logs/cfa_agent.log"

behavior_guard:
  max_steps: 20
  token_budget: 50000
  deviation_threshold: 0.6
  consecutive_deviation_limit: 5