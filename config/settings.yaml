# CFA-Agent 主配置文件
# LLM 配置
llm:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  model_reasoning: "gpt-4o"
  max_tokens_per_request: 4096
  temperature: 0.7

# 应用配置
app:
  host: "127.0.0.1"
  port: 8000
  debug: true

# 数据库配置
database:
  db_path: "./data/db/cfa_agent.db"

# 日志配置
log:
  level: "DEBUG"
  log_file: "./logs/cfa_agent.log"

# 行为护栏配置
behavior:
  max_steps: 20
  token_budget: 50000
  deviation_threshold: 0.6
  consecutive_deviation_limit: 5